name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Nothing is published from a commit that fails the checks every push gets.
  ci:
    uses: ./.github/workflows/ci.yml

  # What has to hold before anything is published. It runs on its own, with first-party actions
  # only, so that the npm token never meets the build tools of the release job.
  preflight:
    runs-on: ubuntu-latest
    # Publishing waits for an owner to approve this environment.
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check that the tag is on master
        run: git merge-base --is-ancestor HEAD origin/master
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Release notes come from CHANGELOG.md, and a version without a section there has none.
      - run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > /dev/null
      # A missing value, an expired token or a mistyped one. Trusted publishing has no token to check.
      - name: Check the npm token
        run: if [ -n "$NODE_AUTH_TOKEN" ]; then npm whoami > /dev/null; fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release:
    needs: [ci, preflight]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # No cache: what a release builds from comes from the module proxy and its checksums, not
      # from what an earlier run left behind.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Release notes come from CHANGELOG.md: GoReleaser's own list would name every commit in the history.
      - run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
      - uses: anchore/sbom-action/download-syft@v0
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

  # npm and the image are published from the release that now exists, each on its own: one failing leaves the other
  # alone, and its job can be re-run by itself.
  npm:
    needs: release
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/npm.yml
    with:
      tag: ${{ github.ref_name }}
      # Staged: nothing goes live on npm until a maintainer approves it there with 2FA.
      staged: true
    secrets: inherit

  image:
    needs: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/image.yml
    with:
      tag: ${{ github.ref_name }}
