name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    # Publishing waits for an owner to approve this environment.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Release notes come from CHANGELOG.md: GoReleaser's own list would start at nirn-proxy's first commit.
      # A release with no section for its version stops here, before anything is published.
      - run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
      # So does one whose npm token is missing its value, expired or mistyped. Trusted publishing has no token to check.
      - name: Check the npm token
        run: if [ -n "$NODE_AUTH_TOKEN" ]; then npm whoami > /dev/null; fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: anchore/sbom-action/download-syft@v0
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

  # npm and the image are published from the release that now exists, each on its own: one failing leaves the other
  # alone, and its job can be re-run by itself.
  npm:
    needs: release
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/npm.yml
    with:
      tag: ${{ github.ref_name }}
      # Staged: nothing goes live on npm until a maintainer approves it there with 2FA.
      staged: true
    secrets: inherit

  image:
    needs: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/image.yml
    with:
      tag: ${{ github.ref_name }}
