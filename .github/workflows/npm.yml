name: npm

# Publishes the npm packages of a release tag, built from that release's own archives so they hold the released
# binaries. The release workflow calls it, and it can be run by hand for a release whose own run stopped before npm.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      staged:
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish the npm packages of, such as v1.0.0
        required: true
        type: string
      staged:
        description: Stage the packages for approval on npmjs.com instead of publishing them directly
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    # Publishing waits for an owner to approve this environment.
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Check the tag
        run: |
          if ! printf '%s' "$TAG" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?'; then
            echo "::error::$TAG is not a release tag"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
      # A run by hand names its own tag, and nothing has checked where that tag points. The release
      # workflow checks its tag before it calls this one.
      - name: Check that the tag is on master
        if: github.event_name == 'workflow_dispatch'
        run: git merge-base --is-ancestor HEAD origin/master
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Rebuilds the part of GoReleaser's dist/ that scripts/npm-packages.mjs reads, from archives checked against
      # the release's checksums.
      - name: Fetch the released binaries
        run: |
          version="${TAG#v}"
          base="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG"
          mkdir dist
          cd dist
          curl -fsSLO "$base/checksums.txt"
          entries=""
          while read -r hash archive; do
            target="${archive#"sluice_${version}_"}"
            target="${target%%.*}"
            case "$archive" in
              *.tar.gz) binary=sluice ;;
              *.zip) binary=sluice.exe ;;
              *) continue ;;
            esac
            curl -fsSLO "$base/$archive"
            echo "$hash  $archive" | sha256sum -c -
            mkdir "$target"
            case "$archive" in
              *.zip) unzip -q "$archive" "$binary" -d "$target" ;;
              *) tar -xzf "$archive" -C "$target" "$binary" ;;
            esac
            entry="\"goos\":\"${target%%_*}\",\"goarch\":\"${target#*_}\",\"path\":\"dist/$target/$binary\""
            entries="$entries{\"type\":\"Binary\",$entry},"
          done < checksums.txt
          echo "[${entries%,}]" > artifacts.json
          echo "{\"version\":\"$version\"}" > metadata.json
      - run: node scripts/npm-packages.mjs
      # Platform packages first, so the main package never points at a version that is not live yet. A pre-release
      # goes to the "next" tag.
      # Staged unless asked otherwise: a token cannot answer npm's 2FA prompt, so staging uploads and leaves the
      # publishing to a maintainer's approval. It also creates a package that does not exist yet, which trusted
      # publishing cannot.
      # A re-run skips what an earlier run published, and what it staged if the job can list that. Trusted publishing
      # cannot, and npm then refuses the staged version itself.
      - name: Publish to npm
        run: |
          version="$(node -p "require('./dist/npm/sluice/package.json').version")"
          tag=latest
          case "$version" in *-*) tag=next ;; esac
          publish=(npm publish)
          if [ "$STAGED" = true ]; then publish=(npm stage publish); fi
          for package in dist/npm/sluice-*/ dist/npm/sluice/; do
            name="$(node -p "require('./${package}package.json').name")"
            if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
              echo "$name@$version is already published"
              continue
            fi
            # Matched with its quotes, so a staged 1.1.0-rc.1 does not pass for 1.1.0.
            if [ "$STAGED" = true ] &&
              npm stage list "$name" --json 2>/dev/null | grep -Fq "\"version\": \"$version\""; then
              echo "$name@$version is already staged"
              continue
            fi
            "${publish[@]}" "$package" --provenance --access public --tag "$tag"
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          STAGED: ${{ inputs.staged }}
