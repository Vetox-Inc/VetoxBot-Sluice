name: Image

# Publishes the container image of a release tag. The release workflow calls it, and it can be run by hand for a
# release whose own run stopped before the image.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish the image of, such as v1.0.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    # Publishing waits for an owner to approve this environment, which also keeps a run by hand to master.
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/vetox-inc/sluice
      TAG: ${{ inputs.tag }}
    steps:
      - name: Check the tag
        run: |
          if ! printf '%s' "$TAG" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?'; then
            echo "::error::$TAG is not a release tag"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
      # A run by hand names its own tag, and nothing has checked where that tag points. The release
      # workflow checks its tag before it calls this one.
      - name: Check that the tag is on master
        if: github.event_name == 'workflow_dispatch'
        run: git merge-base --is-ancestor HEAD origin/master
      # No emulator: the Dockerfile compiles on the build platform and runs nothing on the target's,
      # and CI builds the same three platforms that way on every push.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A published version is never replaced, so a re-run after a run by hand pushes nothing. A stable version
      # also takes X.Y, X and latest: run it by hand only for the newest release, or they move back.
      - id: plan
        run: |
          version="${TAG#v}"
          if docker buildx imagetools inspect "$IMAGE:$version" > /dev/null 2>&1; then
            echo "$IMAGE:$version is already published"
            exit 0
          fi
          tags="$IMAGE:$version"
          case "$version" in
            *-*) ;;
            *) tags="$tags,$IMAGE:${version%.*},$IMAGE:${version%%.*},$IMAGE:latest" ;;
          esac
          {
            echo "version=$version"
            echo "tags=$tags"
            echo "revision=$(git rev-parse HEAD)"
            echo "created=$(git show -s --format=%cI HEAD)"
          } >> "$GITHUB_OUTPUT"
      - id: image
        if: steps.plan.outputs.tags
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.plan.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ steps.plan.outputs.revision }}
            org.opencontainers.image.created=${{ steps.plan.outputs.created }}
          build-args: VERSION=${{ steps.plan.outputs.version }}
      - if: steps.plan.outputs.tags
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
